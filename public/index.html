<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Книга контактів</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Книга контактів</h1>

  <div class="controls">
    <button onclick="loadContacts()">Всі контакти</button>
    <button onclick="clearTable()">Очистити</button>

    <input type="text" id="nameSearchInput" placeholder="Пошук за ім’ям" />
    <button onclick="searchContactByName()">Пошук</button>

    <input type="text" id="contactIdInput" placeholder="Пошук за ID" />
    <button onclick="searchContactById()">Пошук</button>


  </div>

  <table id="contacts-table">
    <thead>
      <tr>
        <th>Ім’я</th>
        <th>Телефон</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function loadContacts() {
      try {
        const res = await fetch('/contacts');
        const { data } = await res.json();
        displayContacts(data);
      } catch (error) {
        alert('Помилка при завантаженні контактів');
        console.error(error);
      }
    }

    async function searchContactById() {
      const id = document.getElementById('contactIdInput').value.trim();
      if (!id) return alert('Введи ID контакту');

      try {
        const res = await fetch(`/contacts/${id}`);
        if (res.status === 404) {
          alert('Контакт не знайдено');
          return;
        }
        const { data } = await res.json();
        displayContacts([data]);
      } catch (error) {
        alert('Помилка при пошуку за ID');
        console.error(error);
      }
    }

    async function searchContactByName() {
      const name = document.getElementById('nameSearchInput').value.trim();
      if (!name) return alert('Введи ім’я для пошуку');

      try {
        const res = await fetch(`/contacts/search?name=${encodeURIComponent(name)}`);
        if (res.status === 404) {
          alert('Контакти не знайдено');
          return;
        }

        const { data } = await res.json();
        displayContacts(data);
      } catch (error) {
        alert('Помилка при пошуку за ім’ям');
        console.error(error);
      }
    }

    function clearTable() {
      document.querySelector('#contacts-table tbody').innerHTML = '';
    }

    function displayContacts(contacts) {
      const tbody = document.querySelector('#contacts-table tbody');
      tbody.innerHTML = '';
      contacts.forEach(contact => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${contact.name}</td>
          <td>${contact.phoneNumber}</td>
          <td>${contact.email ?? '-'}</td>
        `;
        tbody.appendChild(row);
      });
    }
  </script>
</body>
</html>
