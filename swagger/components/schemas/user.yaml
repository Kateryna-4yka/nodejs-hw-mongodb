type: object
required:
  - _id
  - name
  - email
  - password
  - createdAt
  - updatedAt
properties:
  _id:
    description: "User's id"
    type: string
    example: 65e4decdd286b30065d54af9

  name:
    description: "User's name"
    type: string
    example: 'Lola Palola'
  email:
    description: "User's email"
    type: string
    example: example@gmail.com
  password:
    description: "User's string"
    type: string
    example: '4326874345dstsdf'

  createdAt:
    type: string
    format: date-time
    description: "User created at"
    example: 2025-06-14T16:41:11.948+00:00
  updatedAt:
    type: string
    format: date-time
    description: "User updated at"
    example: 2025-06-14T16:41:11.948+00:00
